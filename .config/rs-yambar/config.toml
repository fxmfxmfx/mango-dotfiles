[bar]
height = 28
position = "top"
layer = "top"
background = "#282828ff"
foreground = "#ebdbb2ff"
font = "MxPlus IBM VGA 8x16 MidTilde:pixelsize=16, Symbols Nerd Font:pixelsize=13"
spacing = 0
left_spacing = 0
center_spacing = 0
right_spacing = 8
margin = 8

[[left]]
type = "mango-workspaces"
output = "DP-1"
tag_count = 8
labels = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
show_empty = true
item_spacing = 0
item_width = 21
underline_size = 3
underline_inset = 2
active_foreground = "#282828ff"
active_background = "#fabd2fff"
occupied_foreground = "#ebdbb2ff"
occupied_underline = "#fabd2fff"
empty_foreground = "#a89984ff"
on_click = "~/.config/yambar/scripts/view-tag.sh {index} {output}"

[[center]]
type = "foreign-toplevel"
interval_ms = 500
format = "{text}"
hide_after_ms = 7000
fade_ms = 600

[[center.segments]]
format = "{icon}"
foreground = "#fabd2fff"

[[center.segments]]
format = "{text}"
max-chars = 80

[[right]]
type = "script"
name = "kblayout"
command = ["sh", "-c", "\"$HOME/.config/yambar/scripts/kblayout.sh\""]
mode = "poll"
protocol = "yambar"
interval_ms = 1000
format = "{layout} "

[[right.segments]]
format = " "
foreground = "#fabd2fff"

[[right.segments]]
format = "{layout} "

[[right]]
type = "memory"
interval_ms = 2500
format = "{used:mb}M "

[[right.segments]]
format = " "
foreground = "#fabd2fff"

[[right.segments]]
format = "{used:mb}M "

[[right]]
type = "pipewire"
interval_ms = 1000
format = "{icon}{text}"
muted_text = "muted"

[[right.segments]]
format = "{icon}"
foreground = "#fabd2fff"

[[right.segments]]
format = "{text}"

[[right]]
type = "clock"
format = "{date} {time}"
time_format = "%H:%M"
date_format = "%d.%m"

[[right.segments]]
format = " "
foreground = "#fabd2fff"

[[right.segments]]
format = "{date} "
foreground = "#a89984ff"

[[right.segments]]
format = "{time}"
foreground = "#fabd2fff"
