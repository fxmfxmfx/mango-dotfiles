# audio
exec_once=gentoo-pipewire-launcher

# session environment
exec_once=dbus-update-activation-environment --systemd --all

# portals
exec_once=~/.local/bin/start-portals.sh
exec_once=xsettingsd

# foot server
exec_once=foot --server

# wallpaper & bar
exec_once=awww-daemon
exec_once=mmsg dispatch focusmon,DP-1
exec_once=~/.local/bin/desktop-theme --restore
exec_once=rs-yambar -c ~/.config/rs-yambar/config.toml
exec_once=~/.local/bin/rs-wwidget start

# notifications
exec_once=dunst

# clipboard history
exec_once=wl-paste --watch cliphist store

