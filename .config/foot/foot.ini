[main]
term=foot
font=MxPlus IBM VGA 8x16 MidTilde:size=12, Symbols Nerd Font Mono:size=12
font-bold=MxPlus IBM VGA 8x16 MidTilde:size=12, Symbols Nerd Font Mono:size=12
font-italic=MxPlus IBM VGA 8x16 MidTilde:size=12, Symbols Nerd Font Mono:size=12
font-bold-italic=MxPlus IBM VGA 8x16 MidTilde:size=12, Symbols Nerd Font Mono:size=12
bold-text-in-bright=palette-based
pad=5x5

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[colors]
alpha=1
background=282828
foreground=ebdbb2

selection-foreground=ebdbb2
selection-background=504945

urls=fabd2f

# black 
regular0=282828
bright0=928374

# red 
regular1=cc241d
bright1=fb4934

# green
regular2=98971a
bright2=b8bb26

# yellow
regular3=d79921
bright3=fabd2f

# blue 
regular4=458588
bright4=83a598

# magenta
regular5=b16286
bright5=d3869b

# cyan
regular6=689d6a
bright6=8ec07c

# white 
regular7=a89984
bright7=ebdbb2

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-reset=Control+0
