[main]
term=foot
font=DejaVu Sans Mono:size=11, Symbols Nerd Font Mono:size=11
font-bold=DejaVu Sans Mono:style=Bold:size=11, Symbols Nerd Font Mono:size=11
font-italic=DejaVu Sans Mono:style=Oblique:size=11, Symbols Nerd Font Mono:size=11
font-bold-italic=DejaVu Sans Mono:style=Bold Oblique:size=11, Symbols Nerd Font Mono:size=11
bold-text-in-bright=palette-based
pad=4x4
shell=/usr/bin/fish
selection-target=clipboard

word-delimiters=,│`|:"'()[]{}<>

[bell]
urgent=yes
notify=no
visual=no

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[colors]
alpha=0.80
background=0c0c0c
foreground=e6e6e6

selection-foreground=ffffff
selection-background=2f3549

urls=88c0d0

# black / shadow
regular0=17160f
bright0=4a4634

# red / dark wood, warm shadow
regular1=7b3428
bright1=c05a3e

# green / old olive wall
regular2=687244
bright2=a0aa6b

# yellow / aged brass
regular3=9b7632
bright3=d0aa56

# blue / cold stone-gray from background
regular4=58675f
bright4=8aa09a

# magenta / muted wine-brown
regular5=74515a
bright5=b27a86

# cyan / oxidized brass / greenish reflection
regular6=6f7f69
bright6=a3b89b

# white / cat fur / old paper
regular7=c8bd98
bright7=f3ead0

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-reset=Control+0


